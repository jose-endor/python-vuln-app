# Example GitLab CI pipeline for Endor Labs coverage via endorctl.
# Jobs cover dependency analysis, first-party static analysis, secrets detection,
# and container image analysis for this repository.
#
# IMPORTANT endorctl behavior: a bare `endorctl scan` defaults to dependency scanning
# only. As soon as you add ANY analysis selector flag (--sast, --secrets, ...), the
# implicit dependency scan is no longer included, so we ALWAYS pass --dependencies
# explicitly to keep dependency analysis running alongside.
#
# Coverage model (all jobs are MANUAL / UI-triggered only -- see TRIGGERING below):
#   - endor_baseline : full dependency + SAST + secrets scan. Uses --as-default-branch
#                      so the scanned branch rolls up under one history instead of
#                      creating orphan repository versions. Pick the branch to scan
#                      in the Run pipeline dialog.
#   - endor_container: builds the app image and runs `endorctl container scan`,
#                      associating container findings with this repo's branch history.
#   - endor_mr       : diff-aware MR gate (dependencies + SAST + secrets). INERT under
#                      the manual-only workflow below (MR pipelines are blocked); retained
#                      for when you graduate to PR gating -- re-enable by adding
#                      merge_request_event to workflow:rules.
#
# TRIGGERING: this pipeline is MANUAL-ONLY. The workflow:rules block below means GitLab
# ONLY creates a pipeline when you click "Run pipeline" in the GitLab UI
# (CI_PIPELINE_SOURCE=web). Pushes to main, merge requests, and other branches create
# NO pipeline at all, so this does not interrupt normal developer workflows.
stages:
  - security

# Master switch: only create a pipeline for manual UI runs; everything else is a no-op.
# To also allow scheduled drift scans later, add:  - if: $CI_PIPELINE_SOURCE == "schedule"
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - when: never

# ---------------------------------------------------------------------------
# Shared setup: base image, tool install, dependency install, and caching.
# Both real jobs `extends` this hidden template so the setup lives in one place.
# ---------------------------------------------------------------------------
.endor_base:
  stage: security
  image: python:3.10-bookworm

  # Keep required Endor values in GitLab CI/CD variables, not in the repository:
  #   - ENDOR_NAMESPACE
  #   - ENDOR_API_CREDENTIALS_KEY
  #   - ENDOR_API_CREDENTIALS_SECRET
  variables:
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
    # Keep npm's cache inside the project dir so GitLab can cache it between runs.
    npm_config_cache: "$CI_PROJECT_DIR/.npm"

  # Cache the frontend install so we don't reinstall packages every pipeline.
  # Keyed on the lockfile: cache is reused until dependencies actually change.
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - .npm/
      - frontend/node_modules/

  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates curl git nodejs npm
    - curl -sL https://api.endorlabs.com/download/latest/endorctl_linux_amd64 -o /usr/local/bin/endorctl
    - chmod +x /usr/local/bin/endorctl
    - endorctl --version
    # JS/TS reachability: Endor needs node_modules (incl. @types/* dev deps) present to
    # build the frontend call graph. Peer conflicts can hit ERESOLVE — force legacy peer
    # resolution and fall back to `install` so a peer conflict never fails the whole job.
    # `npm ci` is preferred (deterministic) when the lockfile allows.
    - >
      npm --prefix frontend ci --prefer-offline --no-audit --no-fund --legacy-peer-deps
      || npm --prefix frontend install --no-audit --no-fund --legacy-peer-deps
    # endorctl runs its host-check from the repo ROOT and resolves `typescript` there to
    # decide whether it can build JS/TS call graphs. Our typescript only lives in
    # frontend/node_modules, so root resolution fails and reachability gets disabled.
    # Install the matching compiler globally and expose it via NODE_PATH so the root-level
    # require('typescript') succeeds.
    - npm install -g typescript@4.9.5
    - export NODE_PATH="$(npm root -g)"
    # Python reachability needs no install step: Endor resolves requirements.txt itself and
    # builds the call graph from the bookstore/ source already in the repo.

# ---------------------------------------------------------------------------
# BASELINE: source of truth for the monitored default branch.
# ---------------------------------------------------------------------------
endor_baseline:
  extends: .endor_base
  script:
    # GitLab checks out a DETACHED HEAD, so feed endorctl the real ref name and mark it as
    # the default branch so all main scans roll up under the monitored branch.
    #   --dependencies : reachability-aware dependency analysis (must be explicit once
    #                    other analysis flags are on)
    #   --sast         : first-party source static analysis
    #   --secrets      : credential detection across the checked-out tree
    - >
      endorctl scan --path . --output-type summary
      --dependencies
      --sast
      --secrets
      --detached-ref-name "$CI_COMMIT_REF_NAME"
      --as-default-branch
  rules:
    # Manual UI runs only (further guaranteed by workflow:rules above).
    - if: $CI_PIPELINE_SOURCE == "web"

# ---------------------------------------------------------------------------
# MERGE REQUEST: diff-aware gate for proposed changes.
# Compares against the target branch baseline; does NOT touch the monitored branch.
# ---------------------------------------------------------------------------
endor_mr:
  extends: .endor_base
  script:
    # --pr marks this as a PR scan; --pr-baseline is the branch you're merging into.
    # Same coverage as the baseline (dependencies + SAST + secrets) but scoped as a PR gate.
    # Add --pr-incremental to only re-analyze changed packages (faster).
    # Add --enable-pr-comments once the Endor GitLab SCM integration is connected, to post
    # findings as inline MR comments.
    - >
      endorctl scan --path . --output-type summary
      --dependencies
      --sast
      --secrets
      --pr
      --pr-baseline "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
      --detached-ref-name "$CI_COMMIT_REF_NAME"
  rules:
    # INERT while manual-only: workflow:rules above blocks MR pipelines, so this never fires.
    # To enable the MR gate later, add this same condition to workflow:rules.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ---------------------------------------------------------------------------
# CONTAINER: SBOM + OS/library analysis of the app's Docker image.
# Uses `endorctl container scan` with docker-in-docker (does not extend .endor_base).
#
# Flow: build the image from the repo Dockerfile -> `docker save` to a tar -> scan the tar.
# Using --image-tar keeps the scan self-contained (no registry push) and --path .
# associates container findings with THIS repo + branch.
# ---------------------------------------------------------------------------
endor_container:
  stage: security
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    # Standard GitLab docker-in-docker over TLS wiring.
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
    IMAGE_TAG: "stack-and-spine:$CI_COMMIT_SHORT_SHA"
  before_script:
    - apk add --no-cache ca-certificates curl git
    - curl -sL https://api.endorlabs.com/download/latest/endorctl_linux_amd64 -o /usr/local/bin/endorctl
    - chmod +x /usr/local/bin/endorctl
    - endorctl --version
  script:
    # Build the app image, export to a tar, then analyze the tar.
    - docker build -t "$IMAGE_TAG" .
    - docker save "$IMAGE_TAG" -o image.tar
    # --base-image-scan (default true) also analyzes the detected base image.
    - >
      endorctl container scan --output-type summary
      --image-tar image.tar
      --path .
      --detached-ref-name "$CI_COMMIT_REF_NAME"
  rules:
    # Manual UI runs only (further guaranteed by workflow:rules above).
    - if: $CI_PIPELINE_SOURCE == "web"
