# Run Endor Labs scans from GitLab CI after pushing this GitHub-hosted repo to a GitLab remote.
stages:
  - security

endorctl_scan:
  stage: security
  image: python:3.10-bookworm

  # Keep required Endor values in GitLab CI/CD variables, not in the repository.
  # Required variables:
  # - ENDOR_NAMESPACE
  # - ENDOR_API_CREDENTIALS_KEY
  # - ENDOR_API_CREDENTIALS_SECRET
  variables:
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
    # Keep npm's cache inside the project dir so GitLab can cache it between runs.
    npm_config_cache: "$CI_PROJECT_DIR/.npm"

  # Cache the frontend install so we don't reinstall ~900 packages every pipeline.
  # Keyed on the lockfile: cache is reused until dependencies actually change.
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - .npm/
      - frontend/node_modules/

  # Install the tools endorctl needs to inspect this mixed Python + npm demo app.
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates curl git nodejs npm
    - curl -sL https://api.endorlabs.com/download/latest/endorctl_linux_amd64 -o /usr/local/bin/endorctl
    - chmod +x /usr/local/bin/endorctl
    - endorctl --version
    # JS/TS reachability: Endor needs node_modules (incl. @types/* dev deps) present to build
    # the frontend call graph. This app pins ancient/conflicting packages, so strict installs
    # hit ERESOLVE — force legacy peer resolution and fall back to `install` so a peer conflict
    # never fails the whole scan. `npm ci` is preferred (deterministic) when the lockfile allows.
    - >
      npm --prefix frontend ci --prefer-offline --no-audit --no-fund --legacy-peer-deps
      || npm --prefix frontend install --no-audit --no-fund --legacy-peer-deps
    # Python reachability needs no install step: Endor resolves requirements.txt itself and
    # builds the call graph from the bookstore/ source already in the repo.

  # Scan the full repo. Reachability/call-graph runs by default for every supported language;
  # Python resolves from source, and the frontend now has node_modules so its call graph builds.
  script:
    - endorctl scan --path . --output-type summary

  # Run on merge requests and on branch pushes, including a manually pushed GitLab test branch.
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH
